version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/netcontrol/static/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0", so a
      # TypeScript 7 bump makes `npm ci` fail (ERESOLVE) and takes the whole
      # group pull request down with it. Remove this once typescript-eslint
      # publishes a release whose peer range includes TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Dockerfile base images, pinned as tag@sha256:<index digest>: Dependabot
  # bumps the digest when the tag moves and the tag on a new release.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # The interpreter version is one coordinated change, not an image bump:
      # CI tests only the version the Dockerfile ships (ci.yml matrix,
      # release*.yml, wiki.yml, mypy.ini) and requirements-lock.txt is
      # compiled for it. The image also installs the lock without a C++
      # toolchain, so every compiled pin needs a wheel for the new version
      # first (google-re2 had none for 3.15 when this was added).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # docker-compose.yml service images (postgres, nginx), pinned the same way.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore of the data
      # volume, so it is a deliberate change, never an automatic bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
