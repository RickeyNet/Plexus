name: Release Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate and publish (for example v0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # A release publishes only a commit the CI workflow (ci.yml: tests,
  # pip-audit, bandit, frontend checks) passed on. CI runs on pushes to main
  # and on pull requests, not on tags, so this waits for the CI run whose
  # head commit is the one being released, up to 60 minutes, and fails if
  # there is none, it fails, or it does not finish in time. Trade-off: a tag
  # on a commit that never went through CI (not on main) cannot be released
  # until it does. Re-run this workflow after a re-run of CI succeeds.
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
    steps:
      - name: Wait for CI to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=50" \
              --jq '[.workflow_runs[] | {id, event, status, conclusion}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI succeeded on ${SHA}."
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI finished on ${SHA} without success: ${runs}"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No successful CI run on ${SHA} within 60 minutes: ${runs}"
              exit 1
            fi
            echo "Waiting for CI on ${SHA}: ${runs}"
            sleep 30
          done

  validate-and-publish:
    needs: ci-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Resolve release tag
        id: release
        env:
          # Passed via env rather than interpolated into the script so a
          # crafted dispatch input cannot inject shell commands.
          DISPATCH_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${DISPATCH_TAG}"
            # A manual run builds the commit it was started on and publishes
            # it under the given tag, so that tag must exist and name this
            # commit. The peeled line (^{}) is the commit of an annotated tag.
            if ! [[ "$raw" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must look like v1.2.3"
              exit 1
            fi
            tag_sha=$(git ls-remote origin "refs/tags/${raw}" "refs/tags/${raw}^{}" | sort -k2 | tail -n 1 | cut -f1)
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${raw} names ${tag_sha:-no commit}, this run builds ${GITHUB_SHA}. Start the run from the tag."
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' so PLEXUS_VERSION matches _FALLBACK_VERSION format
          # (1.2.3, not v1.2.3) - the tag itself is kept for image tagging.
          version="${raw#v}"
          echo "tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate version and changelog consistency
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python tools/check_release_consistency.py "${RELEASE_TAG}"

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest

      # Multi-platform builds cannot be loaded into the local daemon, so scan
      # a single-platform build first; its layers stay in the buildx cache and
      # are reused by the publish step below.
      - name: Build image for vulnerability scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:scan
          build-args: |
            PLEXUS_VERSION=${{ steps.release.outputs.version }}
            PLEXUS_GIT_SHA=${{ steps.release.outputs.sha }}
            INSTALL_CLOUD_SDKS=true

      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLEXUS_VERSION=${{ steps.release.outputs.version }}
            PLEXUS_GIT_SHA=${{ steps.release.outputs.sha }}
            INSTALL_CLOUD_SDKS=true
