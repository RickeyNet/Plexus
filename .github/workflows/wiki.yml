name: Wiki

# Publishes the GitHub wiki from the documentation in this repository.
# tools/build_wiki.py builds the pages; this job replaces the markdown
# pages of the wiki with them. The wiki must exist first: enable Wikis in
# the repository settings and save one page in the browser, which creates
# the <repo>.wiki.git repository this job pushes to.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "wiki/**"
      - "deploy/**/*.md"
      - "*.md"
      - "tools/build_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Clone the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/wiki"

      - name: Build the pages
        run: python tools/build_wiki.py --out "${RUNNER_TEMP}/wiki"

      - name: Publish
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from ${GITHUB_SHA::12}"
          git push
