name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install sbom tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Generate release SBOM (CycloneDX)
        run: |
          pip-audit -r requirements-lock.txt -f cyclonedx-json -o sbom.cdx.json --progress-spinner off --no-deps
          # The released images carry the cloud SDKs and install this lock.
          pip-audit -r requirements-cloud-lock.txt -f cyclonedx-json -o sbom-cloud.cdx.json --progress-spinner off --no-deps

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-cyclonedx
          path: |
            sbom.cdx.json
            sbom-cloud.cdx.json

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            sbom.cdx.json
            sbom-cloud.cdx.json
