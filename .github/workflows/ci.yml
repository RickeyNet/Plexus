name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action:
      # this repo's Actions policy only allows GitHub-owned, RickeyNet-owned,
      # or Marketplace-verified actions, and gitleaks-action is none of those
      # (it caused a startup_failure that blocked the whole workflow).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 only: it is the interpreter the Dockerfile ships
        # (python:3.14-slim) and the target declared in ruff.toml / mypy.ini.
        # The codebase uses PEP 758 unparenthesized `except A, B:` clauses
        # (ruff format enforces that form for py314), so 3.11/3.12 cannot
        # import it - re-add them only if the target version is lowered.
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # python-ldap has no Linux wheels and compiles against OpenLDAP headers,
      # which the ubuntu runners don't ship (the Dockerfile installs the same
      # packages for its image build).
      - name: Install system dependencies (python-ldap build headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy netcontrol templates

      - name: Security audit (pip-audit)
        # PYSEC-2026-2858 / GHSA-r374-rxx8-8654: paramiko rsakey.py allows
        # SHA-1 (LOW). No paramiko release fixes it and netmiko 4.x pins
        # paramiko<5, so it cannot be resolved by upgrading. Re-check when
        # netmiko lifts the cap.
        run: pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-2858

      - name: Generate SBOM (CycloneDX)
        run: pip-audit -r requirements-lock.txt -f cyclonedx-json -o sbom.cdx.json --progress-spinner off --no-deps --ignore-vuln PYSEC-2026-2858

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-py${{ matrix.python-version }}
          path: sbom.cdx.json

      - name: Static security checks (bandit)
        run: bandit -q -c bandit.yaml -r netcontrol routes templates -ll -ii

      - name: Tests with coverage gate
        run: pytest --cov=netcontrol --cov=routes --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=30

      - name: Critical module regression gate
        run: python tools/coverage_gate.py coverage.json

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only ephemeral credentials - not used in any deployed environment
          POSTGRES_DB: plexus
          POSTGRES_USER: plexus
          POSTGRES_PASSWORD: plexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexus -d plexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_DB_ENGINE: postgres
      APP_DATABASE_URL: postgresql://plexus:plexus@localhost:5432/plexus

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies (python-ldap build headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Postgres backend smoke tests
        run: pytest tests/test_postgres_backend.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netcontrol/static/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: netcontrol/static/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
