name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Pushes
# to main are never cancelled: each one may publish the edge image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a change needs. backend: any file outside the frontend
  # that is not Markdown. frontend: any file under netcontrol/static/frontend.
  # Both are true when the workflow itself changes or when there is no base
  # commit available to compare with.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; running everything."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          backend=false
          frontend=false
          if printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml'; then
            backend=true
            frontend=true
          fi
          if printf '%s\n' "$files" | grep -q '^netcontrol/static/frontend/'; then
            frontend=true
          fi
          if printf '%s\n' "$files" | grep -v '^netcontrol/static/frontend/' | grep -v '\.md$' | grep -q .; then
            backend=true
          fi
          echo "backend=$backend frontend=$frontend"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action:
      # this repo's Actions policy only allows GitHub-owned, RickeyNet-owned,
      # or Marketplace-verified actions, and gitleaks-action is none of those
      # (it caused a startup_failure that blocked the whole workflow).
      # The expected SHA-256 is the linux_x64 line of the release's
      # gitleaks_8.30.1_checksums.txt; update both together on a version bump.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_TARBALL: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$GITLEAKS_TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GITLEAKS_TARBALL"
          echo "$GITLEAKS_SHA256  $GITLEAKS_TARBALL" | sha256sum -c -
          tar -xzf "$GITLEAKS_TARBALL" gitleaks
          rm "$GITLEAKS_TARBALL"
          ./gitleaks git --no-banner --redact .

  # On a change with no backend files (Markdown or frontend only) this job
  # runs only the wiki check and the tests that read docs/ and the frontend
  # sources; everything else is skipped.
  build-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 only: it is the interpreter the Dockerfile ships
        # (python:3.14-slim) and the target declared in ruff.toml / mypy.ini.
        # The codebase uses PEP 758 unparenthesized `except A, B:` clauses
        # (ruff format enforces that form for py314), so 3.11/3.12 cannot
        # import it - re-add them only if the target version is lowered.
        python-version: ["3.14"]

    # The suite runs on PostgreSQL only (tests/conftest.py requires
    # PLEXUS_TEST_PG_URL). It DROPs and re-creates plexus_test and
    # plexus_test_template, so the service user must be allowed to
    # CREATE DATABASE; the image's POSTGRES_USER is a superuser.
    # Pinned by digest like the postgres service of docker-compose.yml.
    # Dependabot does not update service images in workflows: copy the
    # digest from docker-compose.yml when it moves there.
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          # CI-only ephemeral credentials - not used in any deployed environment
          POSTGRES_DB: plexus
          POSTGRES_USER: plexus
          POSTGRES_PASSWORD: plexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexus -d plexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PLEXUS_TEST_PG_URL: postgresql://plexus:plexus@localhost:5432/plexus_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # python-ldap has no Linux wheels and compiles against OpenLDAP headers,
      # which the ubuntu runners don't ship (the Dockerfile installs the same
      # packages for its image build).
      - name: Install system dependencies (python-ldap build headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # The Docker image installs only requirements-lock.txt (or, with the
      # cloud SDKs, requirements-cloud-lock.txt), so a package added to
      # requirements.txt without regenerating the locks passes the tests here
      # but is missing from the image (the in-app update's new container then
      # fails to start). Also checks the cloud lock covers
      # requirements-cloud.txt and pins shared packages like the base lock.
      - name: Requirements locks cover requirements.txt and requirements-cloud.txt
        if: needs.changes.outputs.backend == 'true'
        run: python tools/check_requirements_lock.py

      - name: Lint (ruff)
        if: needs.changes.outputs.backend == 'true'
        run: ruff check .

      - name: Type check (mypy)
        if: needs.changes.outputs.backend == 'true'
        run: mypy netcontrol templates

      # Every document under docs/ is a wiki page (or listed as not
      # published) and no page links to a file that does not exist.
      - name: Wiki build check
        run: python tools/build_wiki.py --check

      # pip-audit queries pypi.org per package; a slow or dropped response is
      # retried (tools/retry_on_network_error.sh), a reported vulnerability is not.
      - name: Security audit (pip-audit)
        if: needs.changes.outputs.backend == 'true'
        run: bash tools/retry_on_network_error.sh pip-audit --progress-spinner off --timeout 60

      # The cloud SDKs are not installed in this job, but the published images
      # carry them (INSTALL_CLOUD_SDKS=true): audit their hashed lock too.
      - name: Security audit of the cloud SDK lock (pip-audit)
        if: needs.changes.outputs.backend == 'true'
        run: bash tools/retry_on_network_error.sh pip-audit -r requirements-cloud-lock.txt --progress-spinner off --no-deps --timeout 60

      # The image build installs pip itself from a hashed pin (Dockerfile).
      - name: Security audit of the image's pip pin (pip-audit)
        if: needs.changes.outputs.backend == 'true'
        run: bash tools/retry_on_network_error.sh pip-audit -r requirements-pip.txt --progress-spinner off --no-deps --timeout 60

      - name: Generate SBOM (CycloneDX)
        if: needs.changes.outputs.backend == 'true'
        run: |
          bash tools/retry_on_network_error.sh pip-audit -r requirements-lock.txt -f cyclonedx-json -o sbom.cdx.json --progress-spinner off --no-deps --timeout 60
          # The published images (cloud SDKs included) install this lock.
          bash tools/retry_on_network_error.sh pip-audit -r requirements-cloud-lock.txt -f cyclonedx-json -o sbom-cloud.cdx.json --progress-spinner off --no-deps --timeout 60

      - name: Upload SBOM artifact
        if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx-py${{ matrix.python-version }}
          path: |
            sbom.cdx.json
            sbom-cloud.cdx.json

      - name: Static security checks (bandit)
        if: needs.changes.outputs.backend == 'true'
        run: bandit -q -c bandit.yaml -r netcontrol routes templates -ll -ii

      # pytest-xdist workers each clone the template database at the same
      # time; on Postgres defaults that runs out of shared lock memory
      # ("out of shared memory"). Service containers take no command line,
      # so set it with ALTER SYSTEM and restart the container.
      - name: Size Postgres for parallel test workers
        if: needs.changes.outputs.backend == 'true'
        run: |
          pg=${{ job.services.postgres.id }}
          docker exec "$pg" psql -U plexus -d plexus -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker exec "$pg" psql -U plexus -d plexus -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$pg"
          for _ in $(seq 1 30); do
            docker exec "$pg" pg_isready -U plexus -d plexus && break
            sleep 1
          done
          docker exec "$pg" psql -U plexus -d plexus -tAc "SHOW max_locks_per_transaction"

      - name: Tests with coverage gate
        if: needs.changes.outputs.backend == 'true'
        run: pytest -n auto --cov=netcontrol --cov=routes --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=30

      - name: Critical module regression gate
        if: needs.changes.outputs.backend == 'true'
        run: python tools/coverage_gate.py coverage.json

      # Markdown or frontend only: the tests that read docs/ or the frontend
      # sources (wiki pages, in-app help and the guides pages link to, the
      # AWS doc's service table).
      - name: Tests that read docs and frontend sources
        if: needs.changes.outputs.backend != 'true'
        run: pytest tests/test_build_wiki.py tests/test_help_docs.py tests/test_aws_services.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netcontrol/static/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: netcontrol/static/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm audit at --audit-level=high, minus the advisories in
      # audit-allowlist.json (no fix published, dev-only, recheck date).
      - name: Dependency audit (npm audit)
        run: npm run audit:gate

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

  # Publishes the `edge` image that the in-app "edge" update channel pulls.
  # Runs only after every check on a push to main has passed. amd64 only to
  # keep it fast; tagged releases (release.yml) build multi-arch and run the
  # trivy gate.
  publish-edge:
    needs: [changes, secret-scan, build-test, frontend]
    # !failure() so a frontend job skipped for a backend-only change does
    # not skip the publish; any failed or cancelled job still blocks it.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name and version
        id: meta
        run: |
          short="${GITHUB_SHA::12}"
          base="$(sed -n 's/^_FALLBACK_VERSION = "\(.*\)"$/\1/p' netcontrol/version.py)"
          [ -n "${base}" ] || { echo "cannot read _FALLBACK_VERSION" >&2; exit 1; }
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          # SemVer build metadata: _parse_semver drops the "+..." suffix, so
          # release-channel comparisons still see the base version.
          echo "version=${base}+edge.${short}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.name }}:edge
            ${{ steps.meta.outputs.name }}:sha-${{ steps.meta.outputs.short }}
          build-args: |
            PLEXUS_VERSION=${{ steps.meta.outputs.version }}
            PLEXUS_GIT_SHA=${{ github.sha }}
            INSTALL_CLOUD_SDKS=true
