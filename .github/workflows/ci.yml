name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action:
      # this repo's Actions policy only allows GitHub-owned, RickeyNet-owned,
      # or Marketplace-verified actions, and gitleaks-action is none of those
      # (it caused a startup_failure that blocked the whole workflow).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 only: it is the interpreter the Dockerfile ships
        # (python:3.14-slim) and the target declared in ruff.toml / mypy.ini.
        # The codebase uses PEP 758 unparenthesized `except A, B:` clauses
        # (ruff format enforces that form for py314), so 3.11/3.12 cannot
        # import it - re-add them only if the target version is lowered.
        python-version: ["3.14"]

    # The suite runs on PostgreSQL only (tests/conftest.py requires
    # PLEXUS_TEST_PG_URL). It DROPs and re-creates plexus_test and
    # plexus_test_template, so the service user must be allowed to
    # CREATE DATABASE; the image's POSTGRES_USER is a superuser.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only ephemeral credentials - not used in any deployed environment
          POSTGRES_DB: plexus
          POSTGRES_USER: plexus
          POSTGRES_PASSWORD: plexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexus -d plexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PLEXUS_TEST_PG_URL: postgresql://plexus:plexus@localhost:5432/plexus_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # python-ldap has no Linux wheels and compiles against OpenLDAP headers,
      # which the ubuntu runners don't ship (the Dockerfile installs the same
      # packages for its image build).
      - name: Install system dependencies (python-ldap build headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy netcontrol templates

      - name: Security audit (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Generate SBOM (CycloneDX)
        run: pip-audit -r requirements-lock.txt -f cyclonedx-json -o sbom.cdx.json --progress-spinner off --no-deps

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-py${{ matrix.python-version }}
          path: sbom.cdx.json

      - name: Static security checks (bandit)
        run: bandit -q -c bandit.yaml -r netcontrol routes templates -ll -ii

      - name: Tests with coverage gate
        run: pytest --cov=netcontrol --cov=routes --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=30

      - name: Critical module regression gate
        run: python tools/coverage_gate.py coverage.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netcontrol/static/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: netcontrol/static/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

  # Publishes the `edge` image that the in-app "edge" update channel pulls.
  # Runs only after every check on a push to main has passed. amd64 only to
  # keep it fast; tagged releases (release.yml) build multi-arch and run the
  # trivy gate.
  publish-edge:
    needs: [secret-scan, build-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image name and version
        id: meta
        run: |
          short="${GITHUB_SHA::12}"
          base="$(sed -n 's/^_FALLBACK_VERSION = "\(.*\)"$/\1/p' netcontrol/version.py)"
          [ -n "${base}" ] || { echo "cannot read _FALLBACK_VERSION" >&2; exit 1; }
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          # SemVer build metadata: _parse_semver drops the "+..." suffix, so
          # release-channel comparisons still see the base version.
          echo "version=${base}+edge.${short}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.name }}:edge
            ${{ steps.meta.outputs.name }}:sha-${{ steps.meta.outputs.short }}
          build-args: |
            PLEXUS_VERSION=${{ steps.meta.outputs.version }}
            PLEXUS_GIT_SHA=${{ github.sha }}
