# Cap each container's log history at 250 MB (50 MB × 5 files) so logs
# do not silently fill /var/lib/docker over time. Tune by editing the
# anchor below.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  plexus:
    # Local-build deploys (bootstrap.sh / upgrade.sh git mode) build this tag.
    # Registry deploys (upgrade.sh --image) write PLEXUS_IMAGE into .env so
    # `up`/`restart` keep using the pulled image instead of rebuilding.
    image: ${PLEXUS_IMAGE:-plexus-app:local}
    build:
      context: .
      args:
        # Install boto3 / azure / google SDKs so Cloud Visibility and the AWS
        # topology layer collect live data. Set INSTALL_CLOUD_SDKS=false in
        # .env for a smaller image if you never attach cloud accounts.
        INSTALL_CLOUD_SDKS: ${INSTALL_CLOUD_SDKS:-true}
        # Vendor the Pyodide runtime so Topology HTML exports trace paths
        # offline. Set INCLUDE_PYODIDE=false in .env to leave it out.
        INCLUDE_PYODIDE: ${INCLUDE_PYODIDE:-true}
    container_name: plexus-app
    restart: unless-stopped
    logging: *default-logging
    # Give in-flight jobs (firmware pushes / config deploys) time to drain on
    # SIGTERM before Docker force-kills. Must exceed APP_SHUTDOWN_JOB_GRACE_
    # SECONDS (default 15s) plus background-loop teardown.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_DB_ENGINE: postgres
      APP_DATABASE_URL: postgresql://${POSTGRES_USER:-plexus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run deploy/setup.sh to generate one)}@postgres:5432/${POSTGRES_DB:-plexus}
      APP_SESSION_KEY_FILE: /app/state/session.key
      APP_ENCRYPTION_KEY_FILE: /app/state/netcontrol.key
      PLEXUS_SOFTWARE_IMAGES_DIR: /app/state/software_images
      PLEXUS_UPDATES_DIR: /app/state/updates
      PLEXUS_UPDATE_STATUS_DIR: /app/state/update-status
      # Keep uploaded floor-plan images on the persistent state volume;
      # the code default (<app>/floor_plans) is on the ephemeral layer and
      # is lost on every container recreate.
      GEO_FLOOR_PLAN_DIR: /app/state/floor_plans
      # Login lockout and API rate limiting key on the client IP. uvicorn
      # takes it from X-Forwarded-For only when the TCP peer is listed here,
      # so trust exactly the nginx container (its fixed address on the
      # plexus network below). nginx overwrites the header with the address
      # it sees ($remote_addr, deploy/nginx.conf), so the client cannot pick
      # it. Never set "*": uvicorn then takes the left-most entry, which the
      # client chooses. Requests to the loopback port below come from the
      # Docker gateway, which is not trusted, so they keep their own address.
      FORWARDED_ALLOW_IPS: ${PLEXUS_NGINX_IP:-172.30.80.10}
    networks:
      - plexus
    ports:
      # Bind the app port to loopback only - nginx reaches it over the
      # internal Docker network (http://plexus:8080), so publishing it on all
      # host interfaces would expose the app with no TLS/HSTS/security headers.
      # Host-local access (debugging) still works via 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"
      - "2055:2055/udp"    # NetFlow collector
      - "6343:6343/udp"    # sFlow collector
      # Event receivers (Settings > Syslog & Traps). The app runs as a
      # non-root user, so it listens on unprivileged ports: devices send
      # traps to host 162, which reaches the trap receiver on 10162. For
      # devices that can only send syslog to 514, add "514:1514/udp".
      # A port changed in Settings needs the matching change here.
      - "162:10162/udp"    # SNMP traps
      - "1514:1514/udp"    # Syslog receiver
      # Syslog over TCP (RFC 6587) and TLS (RFC 5425), each off until turned
      # on in Settings > Syslog & Traps. TCP and UDP share the number 1514.
      - "1514:1514/tcp"    # Syslog over TCP
      - "6514:6514/tcp"    # Syslog over TLS
    volumes:
      - plexus-db:/app/state
      - ./certs:/app/certs:ro
      - ./software_images:/app/state/software_images
      # In-app update handoff: the app only writes request.json here; the
      # host's plexus-updater systemd unit runs deploy/upgrade.sh. The app
      # never gets the Docker socket (see deploy/DEPLOYMENT.md).
      - ./state/updates:/app/state/updates
      # The updater (root) writes result.json, upgrade.log and rollback.json
      # into this root-owned directory; the app can only read it.
      - ./state/update-status:/app/state/update-status:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits act as runaway backstops (a busy flow collector + job
    # fan-out + large image uploads must not exhaust host memory and OOM
    # Postgres). Tune to the host; these are generous starting points.
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    # Pinned to the multi-arch index digest; Dependabot (docker-compose
    # ecosystem) proposes bumps. Air-gap installs load the image from a tar,
    # which has no registry digest, so deploy/airgap/bundle.sh writes a
    # docker-compose.airgap.yml override that names the same image by tag.
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    container_name: plexus-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plexus}
      POSTGRES_USER: ${POSTGRES_USER:-plexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run deploy/setup.sh to generate one)}
    networks:
      - plexus
    volumes:
      - plexus-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plexus} -d ${POSTGRES_DB:-plexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    # Pinned to a version and its multi-arch index digest (see postgres).
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    container_name: plexus-nginx
    restart: unless-stopped
    logging: *default-logging
    networks:
      plexus:
        # Fixed so the app can trust X-Forwarded-For from this address only
        # (FORWARDED_ALLOW_IPS above). Must sit inside PLEXUS_NETWORK_SUBNET.
        ipv4_address: ${PLEXUS_NGINX_IP:-172.30.80.10}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      plexus:
        condition: service_healthy

# Internal network with a pinned subnet, so nginx gets a fixed address the
# app can trust for X-Forwarded-For. If the subnet clashes with a network the
# host already uses ("Pool overlaps"), set PLEXUS_NETWORK_SUBNET and
# PLEXUS_NGINX_IP (an address inside it, not .1) in .env.
networks:
  plexus:
    ipam:
      config:
        - subnet: ${PLEXUS_NETWORK_SUBNET:-172.30.80.0/24}

volumes:
  plexus-db:
  plexus-postgres:
