[pytest]
# The repo is not an installed package: tests import routes.* and netcontrol.*
# straight from the checkout. `python -m pytest` puts the cwd on sys.path but
# the `pytest` console script (what CI runs) does not, so add it here.
pythonpath = .
addopts = -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Wall-clock cap per test (pytest-timeout). On a hang the thread method
# dumps every thread's stack and aborts the run instead of wedging forever.
timeout = 120
timeout_method = thread
