[pytest]
addopts = -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Wall-clock cap per test (pytest-timeout). On a hang the thread method
# dumps every thread's stack and aborts the run instead of wedging forever.
timeout = 120
timeout_method = thread
markers =
    sqlite_only: test is inherently SQLite-specific (opens DB_PATH directly, PRAGMAs, WAL, read pool); skipped when PLEXUS_TEST_PG_URL runs the suite on Postgres
