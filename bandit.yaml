# Bandit configuration - CI runs `bandit -q -c bandit.yaml -r netcontrol routes templates -ll -ii`.
#
# B608 (hardcoded_sql_expressions) is skipped repo-wide. It flags every
# f-string that builds SQL, which in this codebase is ~110 sites of one
# of these audited patterns, all with values bound via `?` placeholders:
#   - `IN ({placeholders})` where placeholders = ",".join("?" * n)
#   - `WHERE {where}` / `{where_sql}` fragments composed from fixed strings
#   - `SET {', '.join(sets)}` where each entry is a literal "col = ?"
#   - identifier selection from a closed set ("src_ip"/"dst_ip", "in"/"out",
#     an allowed-columns dict, or a helper-only table name)
# None interpolate request input. Re-audit before adding a new
# interpolation site; prefer parameters over identifiers where possible.
skips:
  - B608
