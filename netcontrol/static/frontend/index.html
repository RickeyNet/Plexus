<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plexus</title>
    <!--
      The stylesheet (netcontrol/static/css/style.css) is imported by
      src/main.tsx, so Vite minifies and content-hashes it and adds its
      <link> here at build time. The body font is preloaded so text does not
      wait for the CSS to be parsed first; Vite rewrites this href to the same
      hashed file the @font-face rule resolves to, so it downloads once.
    -->
    <link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
    <!-- Applies the saved theme before first paint (no theme flash). -->
    <script src="/static/js/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
