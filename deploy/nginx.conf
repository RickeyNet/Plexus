# Map for WebSocket upgrade. nginx needs Connection: upgrade only when the
# client sends Upgrade: websocket - for plain HTTP requests we keep the
# default keep-alive behavior so SSE / chunked responses are not interfered
# with.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Client address. Every location below sets X-Forwarded-For to $remote_addr,
# replacing whatever the client sent: login lockout and the API rate limits
# key on that address, so it must not be client-chosen. The app trusts the
# header only from this container (FORWARDED_ALLOW_IPS in docker-compose.yml).
#
# If nginx itself sits behind another load balancer or reverse proxy,
# $remote_addr is that balancer, and every user shares one lockout bucket.
# Restore the real client address from the balancer's header, trusting it
# only from the balancer's own address(es), e.g.:
#
#     set_real_ip_from 192.0.2.10;        # the balancer, or its subnet
#     real_ip_header   X-Forwarded-For;   # or X-Real-IP / proxy_protocol
#     real_ip_recursive on;
#
# See deploy/DEPLOYMENT.md, "Behind another load balancer".

# Open connections per client address. Only connections with a request in
# progress count (an idle keep-alive does not), so a browser with several
# tabs, SSE streams and job sockets stays far below the limit, while one
# address cannot hold hundreds of long-lived streams open. Behind a NAT
# that many users share, raise the number in "limit_conn" below.
limit_conn_zone $binary_remote_addr zone=plexus_conn_per_addr:10m;

# Password sign-in and self-registration requests per client address: each
# one costs the app a slow password hash. One every two seconds on average,
# with room for a short burst; past it nginx answers 429 before the app is
# reached. The app keeps its own lockout and limits behind this. Behind a
# NAT that many users share, raise "rate" here and "burst" below.
limit_req_zone $binary_remote_addr zone=plexus_sign_in_per_addr:10m rate=30r/m;

server {
    listen 443 ssl;
    # HTTP/2 multiplexes the SPA's many parallel API calls over one TLS
    # connection. WebSockets (/ws/) still open over HTTP/1.1: browsers fall
    # back to it for the upgrade, so no location below changes.
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Request bodies: a small limit and normal timeouts everywhere, so an
    # unauthenticated client cannot make nginx or the app hold a huge body.
    # Only the upload locations further down take large bodies. The app
    # enforces the same limits itself (APP_MAX_REQUEST_BODY_MB, default
    # 10 MB, and the upload paths in netcontrol/body_limit.py); keep the two
    # path lists in agreement.
    client_max_body_size 10m;
    client_body_timeout  60s;

    # At most 100 connections at once per client address (zone above);
    # past it nginx answers 429. Applies to every location below.
    limit_conn        plexus_conn_per_addr 100;
    limit_conn_status 429;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression. The app already gzips its responses (GZipMiddleware, which
    # skips SSE), so most arrive compressed and pass through as they are; this
    # covers the rest. gzip_proxied any: every response here is proxied.
    # text/event-stream is deliberately not listed, so streams are never held
    # back to fill a compression block. text/html is always compressed.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/javascript text/css
                      image/svg+xml text/plain text/xml application/xml text/csv;

    # WebSocket endpoints - must forward Upgrade/Connection so FastAPI's
    # WebSocket routes resolve. Lives in its own location block because the
    # connection-upgrade dance interferes with plain HTTP keep-alive.
    location /ws/ {
        proxy_pass http://plexus:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # Long-lived sockets (job output, upgrade progress).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Password sign-in and self-registration: request rate per client
    # address (zone above).
    location ~ ^/api/auth/(login|register)$ {
        limit_req        zone=plexus_sign_in_per_addr burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://plexus:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # Software (firmware) image upload. IOS-XE / NX-OS / firewall images are
    # typically 400 MB to >1 GB. The app caps the file at
    # PLEXUS_MAX_IMAGE_UPLOAD_MB (default 2048) plus 1 MB of multipart
    # framing; raise this limit with it. Streamed straight through to the
    # app instead of being buffered on disk first.
    location = /api/upgrades/images {
        proxy_pass http://plexus:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        client_max_body_size 2100m;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600s;
    }

    # Floor-plan image upload: the app caps the file at 20 MB.
    location ~ ^/api/geo/floors/[0-9]+/image$ {
        proxy_pass http://plexus:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        client_max_body_size 25m;
    }

    # Everything else - HTTP API + static SPA assets.
    location / {
        proxy_pass http://plexus:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # Buffered, so a slow client does not hold the app's connection while
        # it reads a large response. Streams are not: the app sends every
        # text/event-stream (and NDJSON) response with "X-Accel-Buffering: no"
        # (security_headers_middleware in netcontrol/app.py), which turns
        # buffering off for that response alone. WebSockets have /ws/ above.
        proxy_cache off;

        # SSE streams (monitoring, topology, inventory) stay open for a long
        # time; this bounds waiting on the response, not the request body.
        proxy_read_timeout 86400s;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
